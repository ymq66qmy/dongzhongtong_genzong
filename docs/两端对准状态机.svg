<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="865" viewBox="0 0 1120 865" role="img" aria-labelledby="t desc"><title id="t">双端对准、寻峰与锁定</title><desc id="desc">几何对准后检测信标，有则十字寻峰，无则圆周搜索。宽网格复核车端峰后校正机端，回峰复测合格才进入跟踪。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#54706c"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203e3a}.big{font-size:27px;font-weight:bold}.title{font-size:19px;font-weight:bold}.copy{font-size:16px}.line{fill:none;stroke:#54706c;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1120" height="865" fill="#fafbf7"/><text x="38" y="48" class="big">双端天线的对准、寻峰与锁定</text><text x="38" y="83" class="copy">检测位决定是否开始扫描；强度均分用于比较探测点与确认锁定。</text>
<rect x="38" y="116" width="598" height="90" rx="9" fill="#e5f0eb"/><text x="56" y="142" class="title">NEAR　几何对准</text><text x="56" y="169" class="copy">按经纬高与航向互指，双轴到位后检测。</text><text x="56" y="193" class="copy">有信标 → 车端寻峰。</text><path class="line" d="M84 207v25"/><rect x="38" y="235" width="598" height="90" rx="9" fill="#e5f0eb"/><text x="56" y="261" class="title">REFINE　车端十字寻峰</text><text x="56" y="288" class="copy">测中心及两轴正负点，向更强邻点移心。</text><text x="56" y="312" class="copy">4° → 2° → 1°；弱信标也继续寻峰。</text><path class="line" d="M84 326v25"/><rect x="38" y="354" width="598" height="90" rx="9" fill="#fff0dc"/><text x="56" y="380" class="title">VERIFY_PEAK　峰值复核</text><text x="56" y="407" class="copy">在候选周围扫描 5×5 网格，默认每轴 ±8°。</text><text x="56" y="431" class="copy">更强点 → 重新精扫；已收敛且无更强点 → 校正机端。</text><path class="line" d="M84 445v25"/><rect x="38" y="473" width="598" height="90" rx="9" fill="#fff0dc"/><text x="56" y="499" class="title">CAL_AIR　机端方位 / 俯仰校正</text><text x="56" y="526" class="copy">车端回报测量结果，选择最优机端修正。</text><text x="56" y="550" class="copy">最细档稳定后双端回峰到位，重新采满 5 帧。</text><path class="line" d="M84 564v25"/><rect x="38" y="592" width="598" height="90" rx="9" fill="#e5f0eb"/><text x="56" y="618" class="title">TRACK　双端跟踪</text><text x="56" y="645" class="copy">中心复测均分 ≥ −88 才进入跟踪。</text><text x="56" y="669" class="copy">车端保持信标小十字，机端按位置变化补偿。</text><path class="line" d="M84 683v25"/><rect x="38" y="711" width="598" height="90" rx="9" fill="#e5f0eb"/><text x="56" y="737" class="title">RECOVER　局部重捕</text><text x="56" y="764" class="copy">连续两轮弱于 −96 时进入；在最后中心附近扫 25 点。</text><text x="56" y="788" class="copy">有信标 → 从最强点重新精扫；全部未检出 → 几何对准。</text>
<rect x="715" y="116" width="356" height="90" rx="9" fill="#e7edf3"/><text x="730" y="145" class="title">SWEEP　圆周搜索</text><text x="730" y="172" class="copy">几何方向未检出时才转圈找信标。</text><text x="730" y="195" class="copy">一旦检出就停止转圈，进入精扫。</text><path class="line" d="M637 160h75"/><path class="line" d="M855 207v64H638"/>
<path class="line" d="M638 398h76v-97h-76"/><text x="733" y="388" class="copy">网格找到更强候选，移心再测</text>
<path class="line" d="M638 512h340v-90H638"/><text x="743" y="490" class="copy">弱峰或轮数用尽，继续复核</text>
<text x="38" y="840" class="copy">信标存在位优先；仅有 RSSI 时默认检测下限 −116。扫描范围、死区与门限需实测标定。</text></svg>
